# Static site: no build step. Netlify serves this folder as-is.
[build]
  publish = "."
  command = ""

# Images, frames and videos rarely change: let browsers keep them for a week (repeat visits load instantly)
# and quietly refresh them in the background. Pages themselves are not cached, so text updates show at once.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/demos/vapi.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
